name: Porssivahti Cron

on:
  schedule:
    # Ajaa skriptin maanantaista perjantaihin tunneittain pörssin aukioloaikoina (UTC-aikaa)
    - cron: '0 8-16 * * 1-5'
  workflow_dispatch: # Mahdollistaa myös manuaalisen käynnistyksen napista

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna kirjastot
        run: |
          pip install requests yfinance groq

      - name: Suorita Pörssivahti
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py
