name: Poerssivahti ja Botti 2

on:
  schedule:
    - cron: '0 1 * * 1-5'  # Ajo yöllä ma-pe, kun pörssit ovat sulkeutuneet
  workflow_dispatch:       # Mahdollistaa myös manuaalisen käynnistyksen

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance groq

      - name: Run Poerssivahti & Botti 2
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python poerssivahti.py

      # TÄMÄ VAIHE KORJAA VIRHEEN:
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Päivitetty pörssivahdin muisti, salkku ja index.html"
          file_pattern: "lahetetyt_lokit.txt salkku_data.json index.html"
          commit_options: '--allow-empty-message'
