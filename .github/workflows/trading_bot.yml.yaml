name: Trading Bot System Workflow

on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

jobs:
  run-trading-system:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    # 🌟 GLOBAALIT YMPÄRISTÖMUUTTUJAT KOKO AJOLLE (kuten vanhassa botissa)
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install groq yfinance pandas requests

      - name: Run Market Scanner (Botti 1)
        run: |
          python poerssivahti.py

      - name: Run Paper Trader (Botti 2)
        run: |
          python paper_trader.py

      - name: Run Telegram QA Listener
        run: |
          python telegram_qa_bot.py

      - name: Commit and Push Updated Portfolio & Signals
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add portfolio.json signals.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update portfolio and signals"
          git push
